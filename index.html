<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Manufacturer Scatter Plot</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        #logo-container {
            display: flex;
            flex-wrap: wrap;
        }
        .logo {
            margin: 10px;
            cursor: pointer;
            width: 100px; /* Adjust as needed */
            height: 100px; /* Adjust as needed */
        }
        .charts-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .plot, .chart, .area-chart, .weight {
            width: 48%; /* Adjust width to take half of the available space */
            height: 400px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .tooltip {
            background-color: white;
            border: 1px solid black;
            padding: 5px;
            position: absolute;
            display: none;
        }
    </style>
</head>
<body>
    <div id="logo-container">
        <!-- Logos will be dynamically inserted here -->
    </div>
    <div class="charts-container">
        <div class="plot" id="plot"></div>
        <div class="chart" id="chart"></div>
    </div>
    <div class="charts-container">
        <div class="area-chart" id="area-chart"></div>
        <div class="weight" id="weight-chart"></div> <!-- chart changed to weight -->
    </div>
    <script src="script.js"></script>
</body>
</html>
